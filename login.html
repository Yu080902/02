<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <link rel="stylesheet" href="css/login.css" type="text/css">
</head>
<body>
    <div id="wrapper">
        <header>
            <p>請輸入帳號密碼</p>
        </header>
        <div id="content">
            <form action="">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" class="form-control"
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Passsword" class="form-control"
                </div>
                <div class="checkbox">
                    <label for="">
                        <input type="checkbox" name="remember">記住我
                    </label>
                </div>
                <button type="submit" class="btn"><a href="index.html">登入</a></button>
            </form>
        </div>
    </div>
</body>
</html>
